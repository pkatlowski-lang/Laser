<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edytor projektów do lasera — interaktywny edytor parametryczny</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Dancing+Script:wght@600&family=Great+Vibes&family=Montserrat:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#15100a; --surface:#1f1810; --surface2:#291f13; --border:#3d2f1c;
  --accent:#d8a14a; --accent-dark:#a8762c; --text:#ece2d0; --muted:#a8967c;
  --cut:#ff2d2d; --engrave:#1c1c1c; --score:#2f7bd8;
  --font-d:'Playfair Display',serif; --font-b:'Inter',system-ui,sans-serif; --r:9px;
}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font-b);line-height:1.45;overflow:hidden}
.app{height:100vh;display:flex;flex-direction:column}

/* ---- Top toolbar ---- */
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 12px;background:var(--surface);border-bottom:1px solid var(--border)}
.toolbar .brand{font-family:var(--font-d);font-weight:700;color:#fff;font-size:1.02rem;margin-right:6px;white-space:nowrap}
.toolbar .brand span{color:var(--accent)}
.tgroup{display:flex;gap:4px;align-items:center;padding-right:8px;margin-right:2px;border-right:1px solid var(--border)}
.tgroup:last-child{border-right:none}
.tbtn{display:inline-flex;align-items:center;justify-content:center;gap:5px;min-width:38px;height:36px;padding:0 9px;border-radius:8px;border:1.5px solid var(--border);background:var(--surface2);color:var(--text);font-size:.8rem;font-weight:600;cursor:pointer;transition:.12s;white-space:nowrap}
.tbtn:hover{border-color:var(--accent);color:var(--accent)}
.tbtn.active{background:var(--accent);border-color:var(--accent);color:#1a1308}
.tbtn:disabled{opacity:.4;cursor:not-allowed}
.tbtn .ico{font-size:1rem;line-height:1}
.zoomval{min-width:50px;text-align:center;font-size:.8rem;color:var(--muted);font-weight:600}

/* ---- Main 3-column ---- */
.main{flex:1;display:flex;min-height:0}
.panel{flex:0 0 270px;background:var(--surface);display:flex;flex-direction:column;overflow-y:auto}
.panel.left{border-right:1px solid var(--border)}
.panel.right{border-left:1px solid var(--border)}
.panel h2{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:14px 16px 8px;font-weight:700}
.stage{flex:1;position:relative;min-width:0;background:
  repeating-linear-gradient(45deg,#0f0b06 0 10px,#120d07 10px 20px)}
#canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.stage .hint-empty{position:absolute;left:50%;top:14px;transform:translateX(-50%);font-size:.8rem;color:var(--muted);background:rgba(0,0,0,.35);padding:6px 12px;border-radius:100px;pointer-events:none}

/* canvas geometry styling */
.doc-bg{fill:#e8d9b8}
.grid-line{stroke:rgba(0,0,0,.07);stroke-width:1px;vector-effect:non-scaling-stroke}
.grid-line.major{stroke:rgba(0,0,0,.14)}
.doc-border{fill:none;stroke:#b89b66;stroke-width:1.5px;vector-effect:non-scaling-stroke}
.geo-cut{fill:transparent;stroke:var(--cut);stroke-width:1.6px;vector-effect:non-scaling-stroke}
.geo-score{fill:transparent;stroke:var(--score);stroke-width:1.4px;stroke-dasharray:4 3;vector-effect:non-scaling-stroke}
.geo-engrave{fill:var(--engrave);stroke:none}
.geo-engrave-txt{fill:var(--engrave);stroke:none}
.geo-cut-txt{fill:transparent;stroke:var(--cut);stroke-width:1.4px;vector-effect:non-scaling-stroke}
.geo-score-txt{fill:transparent;stroke:var(--score);stroke-width:1.4px;vector-effect:non-scaling-stroke}
.sel-box{fill:none;stroke:var(--accent);stroke-width:1.3px;vector-effect:non-scaling-stroke;stroke-dasharray:5 3}
.sel-handle{fill:#fff;stroke:var(--accent);stroke-width:1.3px;vector-effect:non-scaling-stroke}
.sel-rot-line{stroke:var(--accent);stroke-width:1.3px;vector-effect:non-scaling-stroke}
.sel-rot{fill:var(--accent);stroke:#fff;stroke-width:1.2px;vector-effect:non-scaling-stroke}
.guide-line{stroke:#ff4fa6;stroke-width:1px;stroke-dasharray:5 4;vector-effect:non-scaling-stroke;pointer-events:none}

/* ---- Property fields ---- */
.field{padding:0 16px 12px}
.field label{display:block;font-size:.72rem;font-weight:600;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.03em}
.field .row2{display:flex;gap:8px}
.field input[type=number],.field input[type=text],.field select{width:100%;padding:8px 10px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:inherit;font-size:.85rem}
.field input:focus,.field select:focus{outline:none;border-color:var(--accent)}
.range-wrap{display:flex;align-items:center;gap:10px}
.range-wrap input[type=range]{flex:1;accent-color:var(--accent)}
.range-val{font-weight:700;color:var(--accent);min-width:40px;text-align:right;font-size:.82rem}
.seg{display:flex;gap:4px}
.seg button{flex:1;padding:8px 4px;border-radius:6px;border:1.5px solid var(--border);background:var(--surface2);color:var(--muted);font-size:.74rem;font-weight:600;cursor:pointer}
.seg button.on{border-color:var(--accent);color:#1a1308;background:var(--accent)}
.seg button.cut.on{background:var(--cut);border-color:var(--cut);color:#fff}
.seg button.engrave.on{background:var(--engrave);border-color:var(--engrave);color:#fff}
.seg button.score.on{background:var(--score);border-color:var(--score);color:#fff}
.empty-note{padding:8px 16px 20px;font-size:.82rem;color:var(--muted);line-height:1.6}

/* ---- Layers ---- */
.layers{display:flex;flex-direction:column;gap:3px;padding:0 10px 14px}
.layer{display:flex;align-items:center;gap:6px;padding:7px 8px;border-radius:7px;border:1.5px solid transparent;background:var(--surface2);cursor:pointer}
.layer.sel{border-color:var(--accent)}
.layer .lname{flex:1;font-size:.8rem;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.layer .lname input{width:100%;background:transparent;border:none;color:var(--text);font:inherit;font-size:.8rem}
.layer .lico{font-size:.85rem;opacity:.65;cursor:pointer;background:none;border:none;color:var(--text);padding:2px 3px;border-radius:4px}
.layer .lico:hover{opacity:1;background:rgba(255,255,255,.08)}
.layer .swatch{width:11px;height:11px;border-radius:3px;flex:0 0 auto}
.sw-cut{background:var(--cut)} .sw-engrave{background:var(--engrave);border:1px solid #555} .sw-score{background:var(--score)}

/* ---- Parameters (parametry globalne) ---- */
.params{display:flex;flex-direction:column;gap:8px;padding:0 14px 12px}
.param-card{background:var(--surface2);border:1.5px solid var(--border);border-radius:8px;padding:9px 10px}
.param-card .prow{display:flex;gap:6px;align-items:center}
.param-card .prow+.prow{margin-top:6px}
.param-card input[type=text]{flex:1;min-width:0;padding:6px 8px;background:var(--surface);border:1px solid var(--border);border-radius:6px;color:var(--accent);font-weight:700;font-size:.8rem;font-family:inherit}
.param-card input[type=number]{width:58px;flex:0 0 auto;padding:6px 5px;background:var(--surface);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:.78rem;font-family:inherit;text-align:center}
.param-card input[type=range]{flex:1;accent-color:var(--accent)}
.param-card .ptag{font-size:.66rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;flex:0 0 auto}
.param-card .pdel{flex:0 0 auto;background:none;border:none;color:var(--muted);cursor:pointer;font-size:.95rem;padding:3px 6px;border-radius:5px;line-height:1}
.param-card .pdel:hover{color:var(--cut);background:rgba(255,255,255,.08)}
.addparam{margin:0 14px 16px;width:calc(100% - 28px);justify-content:center}
.bind-sel{margin-top:6px;width:100%;padding:6px 8px;background:var(--surface2);border:1px dashed var(--border);border-radius:6px;color:var(--accent);font-size:.7rem;font-family:inherit;cursor:pointer}
.bind-sel:focus{outline:none;border-color:var(--accent)}
.params-empty{padding:2px 2px 6px;font-size:.78rem;color:var(--muted);line-height:1.55}

/* ---- Templates ---- */
.tpl{display:grid;grid-template-columns:1fr 1fr;gap:7px;padding:0 14px 16px}
.tpl button{padding:9px 6px;border-radius:7px;border:1.5px solid var(--border);background:var(--surface2);color:var(--text);font-size:.76rem;font-weight:600;cursor:pointer}
.tpl button:hover{border-color:var(--accent);color:var(--accent)}

.legend{display:flex;gap:14px;flex-wrap:wrap;padding:10px 16px;border-top:1px solid var(--border);font-size:.72rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:13px;height:13px;border-radius:3px;display:inline-block}
.li-cut{background:none;border:2px solid var(--cut)} .li-eng{background:var(--engrave);border:1px solid #666} .li-sco{background:none;border:2px dashed var(--score)}

@media(max-width:1040px){.panel{flex-basis:230px}}
@media(max-width:820px){
  body{overflow:auto}
  .app{height:auto;min-height:100vh}
  .main{flex-direction:column;overflow:visible}
  .panel{flex:0 0 auto;max-height:none;width:100%;border:none;border-top:1px solid var(--border)}
  .stage{order:1;min-height:62vh;flex:0 0 auto} .panel.right{order:2} .panel.left{order:3}
  .toolbar{position:sticky;top:0;z-index:5}
}
</style>
</head>
<body>
<div class="app">
  <div class="toolbar">
    <div class="brand">Edytor <span>do&nbsp;lasera</span></div>
    <div class="tgroup" id="tools"></div>
    <div class="tgroup">
      <button class="tbtn" id="undoBtn" title="Cofnij (Ctrl+Z)"><span class="ico">↶</span></button>
      <button class="tbtn" id="redoBtn" title="Ponów (Ctrl+Y)"><span class="ico">↷</span></button>
      <button class="tbtn" id="copyBtn" title="Kopiuj (Ctrl+C)"><span class="ico">⎘</span></button>
      <button class="tbtn" id="pasteBtn" title="Wklej (Ctrl+V)"><span class="ico">📋</span></button>
      <button class="tbtn" id="dupBtn" title="Duplikuj (Ctrl+D)"><span class="ico">⧉</span></button>
      <button class="tbtn" id="delBtn" title="Usuń (Delete)"><span class="ico">🗑</span></button>
    </div>
    <div class="tgroup">
      <button class="tbtn" id="zoomOut" title="Pomniejsz"><span class="ico">−</span></button>
      <span class="zoomval" id="zoomVal">100%</span>
      <button class="tbtn" id="zoomIn" title="Powiększ"><span class="ico">+</span></button>
      <button class="tbtn" id="zoomFit" title="Dopasuj">Dopasuj</button>
    </div>
    <div class="tgroup">
      <button class="tbtn" id="snapBtn" title="Przyciągaj do siatki">⊞ Siatka</button>
    </div>
    <div class="tgroup">
      <button class="tbtn" id="exportBtn" style="background:linear-gradient(135deg,var(--accent),var(--accent-dark));border-color:var(--accent);color:#1a1308">⬇ Pobierz SVG</button>
    </div>
  </div>

  <div class="main">
    <aside class="panel left">
      <h2>Parametry globalne</h2>
      <div class="params" id="params"></div>
      <button type="button" class="tbtn addparam" id="addParamBtn">+ Dodaj parametr</button>
      <h2>Szablony startowe</h2>
      <div class="tpl" id="templates"></div>
      <h2>Warstwy</h2>
      <div class="layers" id="layers"></div>
      <div class="legend">
        <span><i class="li-cut"></i> cięcie</span>
        <span><i class="li-eng"></i> grawer</span>
        <span><i class="li-sco"></i> nacięcie</span>
      </div>
    </aside>

    <section class="stage">
      <svg id="canvas" xmlns="http://www.w3.org/2000/svg"></svg>
      <div class="hint-empty" id="hintEmpty">Wybierz narzędzie i narysuj kształt na płycie — albo kliknij szablon po lewej</div>
    </section>

    <aside class="panel right">
      <h2>Właściwości</h2>
      <div id="props"></div>
    </aside>
  </div>
</div>

<script>
(function(){
  const SVG_NS='http://www.w3.org/2000/svg';
  const COLORS={cut:'#ff2d2d',engrave:'#1c1c1c',score:'#2f7bd8'};
  const FONTS=[
    ['"Playfair Display", serif','Playfair Display'],
    ['"Dancing Script", cursive','Dancing Script'],
    ['"Great Vibes", cursive','Great Vibes'],
    ['"Montserrat", sans-serif','Montserrat'],
    ['"Inter", sans-serif','Inter']
  ];

  function fmt(n){ return Number(Number(n).toFixed(3)); }
  function uid(){ return 'o'+Math.random().toString(36).slice(2,9); }
  function puid(){ return 'p'+Math.random().toString(36).slice(2,8); }
  function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
  function deg2rad(d){ return d*Math.PI/180; }
  function rotatePt(px,py,cx,cy,ang){ const s=Math.sin(ang),c=Math.cos(ang),dx=px-cx,dy=py-cy; return {x:cx+dx*c-dy*s,y:cy+dx*s+dy*c}; }
  function escapeXml(s){ return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[m])); }

  /* ---------------- State ---------------- */
  const state={
    docW:300, docH:200,
    objects:[],
    selectedIds:[],
    tool:'select',
    snap:true, grid:10,
    penDraft:null, penPreview:null, guideLines:null,
    view:{x:-20,y:-20,w:340,h:240},
    params:[{id:'p_grubosc',name:'grubość_materiału',value:3,min:1,max:12,step:0.5}],
    history:[], hIndex:-1
  };

  const TOOLS=[
    {key:'select',label:'Wskaźnik',ico:'↖'},
    {key:'pan',label:'Rączka',ico:'✋'},
    {key:'rect',label:'Prostokąt',ico:'▭'},
    {key:'ellipse',label:'Elipsa',ico:'◯'},
    {key:'polygon',label:'Wielokąt',ico:'⬡'},
    {key:'star',label:'Gwiazda',ico:'★'},
    {key:'line',label:'Linia',ico:'╱'},
    {key:'pen',label:'Pióro',ico:'✎'},
    {key:'text',label:'Tekst',ico:'T'}
  ];

  /* ---------------- Geometry ---------------- */
  function roundedRectD(x,y,w,h,r){
    r=Math.min(r,Math.min(w,h)/2);
    if(r<=0) return `M${fmt(x)} ${fmt(y)}H${fmt(x+w)}V${fmt(y+h)}H${fmt(x)}Z`;
    return `M${fmt(x+r)} ${fmt(y)}H${fmt(x+w-r)}A${fmt(r)} ${fmt(r)} 0 0 1 ${fmt(x+w)} ${fmt(y+r)}`+
           `V${fmt(y+h-r)}A${fmt(r)} ${fmt(r)} 0 0 1 ${fmt(x+w-r)} ${fmt(y+h)}`+
           `H${fmt(x+r)}A${fmt(r)} ${fmt(r)} 0 0 1 ${fmt(x)} ${fmt(y+h-r)}`+
           `V${fmt(y+r)}A${fmt(r)} ${fmt(r)} 0 0 1 ${fmt(x+r)} ${fmt(y)}Z`;
  }
  function ellipseD(cx,cy,rx,ry){
    rx=Math.abs(rx);ry=Math.abs(ry);
    return `M${fmt(cx-rx)} ${fmt(cy)}a${fmt(rx)} ${fmt(ry)} 0 1 0 ${fmt(2*rx)} 0a${fmt(rx)} ${fmt(ry)} 0 1 0 ${fmt(-2*rx)} 0Z`;
  }
  function polyD(cx,cy,rx,ry,sides,startDeg){
    const pts=[]; const s0=deg2rad(startDeg||-90);
    for(let i=0;i<sides;i++){ const a=s0+i*2*Math.PI/sides; pts.push([cx+rx*Math.cos(a),cy+ry*Math.sin(a)]); }
    return pts.map((p,i)=>(i?'L':'M')+fmt(p[0])+' '+fmt(p[1])).join('')+'Z';
  }
  function starD(cx,cy,rx,ry,points,inner,startDeg){
    const pts=[]; const s0=deg2rad(startDeg||-90);
    for(let i=0;i<points*2;i++){ const out=i%2===0; const a=s0+i*Math.PI/points;
      const px=cx+(out?rx:rx*inner)*Math.cos(a), py=cy+(out?ry:ry*inner)*Math.sin(a); pts.push([px,py]); }
    return pts.map((p,i)=>(i?'L':'M')+fmt(p[0])+' '+fmt(p[1])).join('')+'Z';
  }

  // Returns the path "d" for non-text shapes (in document/mm coords).
  function shapeD(o){
    const {x,y,w,h}=o, cx=x+w/2, cy=y+h/2;
    switch(o.type){
      case 'rect': return roundedRectD(x,y,w,h,o.rx||0);
      case 'ellipse': return ellipseD(cx,cy,w/2,h/2);
      case 'polygon': return polyD(cx,cy,w/2,h/2,Math.max(3,o.sides||6),-90);
      case 'star': return starD(cx,cy,w/2,h/2,Math.max(3,o.points||5),clamp(o.inner||0.5,0.05,0.95),-90);
      case 'line': return o.flip ? `M${fmt(x)} ${fmt(y+h)}L${fmt(x+w)} ${fmt(y)}` : `M${fmt(x)} ${fmt(y)}L${fmt(x+w)} ${fmt(y+h)}`;
      case 'path': return o.d||'';
      default: return '';
    }
  }

  /* ------ repeat modifier -> list of SVG transform strings ------ */
  function repeatTransforms(o){
    const r=o.repeat;
    if(!r||r.type==='none') return [''];
    const cx=o.x+o.w/2, cy=o.y+o.h/2;
    const list=[];
    if(r.type==='linear'){
      const n=Math.max(1,r.count|0);
      for(let i=0;i<n;i++) list.push(`translate(${fmt(i*r.dx)} ${fmt(i*r.dy)})`);
    } else if(r.type==='grid'){
      const cols=Math.max(1,r.cols|0), rows=Math.max(1,r.rows|0);
      for(let ry=0;ry<rows;ry++) for(let rx=0;rx<cols;rx++) list.push(`translate(${fmt(rx*r.dx)} ${fmt(ry*r.dy)})`);
    } else if(r.type==='circular'){
      const n=Math.max(1,r.count|0), total=r.angle||360, pivX=cx, pivY=cy+(r.radius||0);
      for(let i=0;i<n;i++){ const a=i*total/n; list.push(`rotate(${fmt(a)} ${fmt(pivX)} ${fmt(pivY)})`); }
    } else if(r.type==='mirror'){
      list.push('');
      if(r.axis==='vertical'||r.axis==='both') list.push(`translate(${fmt(2*cx)} 0) scale(-1 1)`);
      if(r.axis==='horizontal'||r.axis==='both') list.push(`translate(0 ${fmt(2*cy)}) scale(1 -1)`);
      if(r.axis==='both') list.push(`translate(${fmt(2*cx)} ${fmt(2*cy)}) scale(-1 -1)`);
    }
    return list.length?list:[''];
  }

  /* ---------- markup for one object ---------- */
  function innerGeometry(o, forExport){
    if(o.type==='path'){
      const lcx=(o.bx||0)+(o.bw||0)/2, lcy=(o.by||0)+(o.bh||0)/2;
      const t=`translate(${fmt(o.x||0)} ${fmt(o.y||0)}) rotate(${fmt(o.rotation||0)} ${fmt(lcx)} ${fmt(lcy)})`;
      const fr=o.fillRule==='evenodd'?' fill-rule="evenodd"':'';
      let geo;
      if(forExport){ geo=`<path d="${o.d}"${exportShapeStyle(o)}${fr}/>`; }
      else { const cls=o.mode==='engrave'?'geo-engrave':o.mode==='score'?'geo-score':'geo-cut'; geo=`<path d="${o.d}" class="${cls}"${fr}/>`; }
      return `<g transform="${t}">${geo}</g>`;
    }
    const cx=o.x+o.w/2, cy=o.y+o.h/2;
    const rot=o.rotation? ` transform="rotate(${fmt(o.rotation)} ${fmt(cx)} ${fmt(cy)})"`:'';
    let geo;
    if(o.type==='text'){
      const fs=o.fontSize||24;
      const yBase=o.y + fs*0.34; // o.y stored as vertical center for text
      const cls = forExport?'' : (o.mode==='engrave'?' class="geo-engrave-txt"':o.mode==='score'?' class="geo-score-txt"':' class="geo-cut-txt"');
      const style = forExport ? exportTextStyle(o) : '';
      geo=`<text x="${fmt(o.x)}" y="${fmt(yBase)}" text-anchor="middle" font-family='${o.font}' font-size="${fmt(fs)}"${cls}${style}>${escapeXml(o.text||'')}</text>`;
    } else {
      const d=shapeD(o);
      if(forExport){ geo=`<path d="${d}"${exportShapeStyle(o)}/>`; }
      else { const cls=o.mode==='engrave'?'geo-engrave':o.mode==='score'?'geo-score':'geo-cut'; geo=`<path d="${d}" class="${cls}"/>`; }
    }
    return `<g${rot}>${geo}</g>`;
  }
  function exportShapeStyle(o){
    if(o.mode==='engrave') return ` fill="${COLORS.engrave}" stroke="none"`;
    if(o.mode==='score') return ` fill="none" stroke="${COLORS.score}" stroke-width="0.12" stroke-dasharray="1.2 0.9"`;
    return ` fill="none" stroke="${COLORS.cut}" stroke-width="0.12"`;
  }
  function exportTextStyle(o){
    if(o.mode==='engrave') return ` fill="${COLORS.engrave}" stroke="none"`;
    if(o.mode==='score') return ` fill="none" stroke="${COLORS.score}" stroke-width="0.12"`;
    return ` fill="none" stroke="${COLORS.cut}" stroke-width="0.12"`;
  }
  function objMarkup(o, forExport){
    const inner=innerGeometry(o, forExport);
    const copies=repeatTransforms(o).map(t=> t? `<g transform="${t}">${inner}</g>` : inner).join('');
    const attrs= forExport?'' : ` data-id="${o.id}" style="cursor:${o.locked?'not-allowed':'move'}"`;
    return `<g${attrs}>${copies}</g>`;
  }

  /* ---------------- Canvas rendering ---------------- */
  const canvas=document.getElementById('canvas');
  let gGrid, gObjects, gOverlay;
  function buildCanvasSkeleton(){
    canvas.innerHTML=`<g id="gGrid"></g><g id="gObjects"></g><g id="gOverlay"></g>`;
    gGrid=canvas.querySelector('#gGrid');

  function canvasRect(){ return canvas.getBoundingClientRect(); }

  function renderGrid(){

  function renderObjects(){

  }

  // measured/analytic local (unrotated) bbox of an object
  function objBBox(o){
    if(o.type==='path'){ return {x:(o.bx||0)+(o.x||0), y:(o.by||0)+(o.y||0), w:o.bw||1, h:o.bh||1}; }
    if(o.type==='text'){

  // różowe linie pomocnicze "smart guides" pokazujące się przy przyciąganiu do krawędzi/środków innych elementów

  function renderOverlay(){

    if(sel.length===0){ gOverlay.innerHTML=guideLinesMarkup(); return; }
    if(sel.length>1){                                           // wiele zaznaczonych: ramki + wspólny prostokąt, bez uchwytów
      let minx=Infinity,miny=Infinity,maxx=-Infinity,maxy=-Infinity, s='';
      sel.forEach(o=>{
        const bb=rotatedBBox(o); minx=Math.min(minx,bb.minx); miny=Math.min(miny,bb.miny); maxx=Math.max(maxx,bb.maxx); maxy=Math.max(maxy,bb.maxy);
        const b=objBBox(o), c={x:b.x+b.w/2,y:b.y+b.h/2};
        s+=`<g transform="rotate(${fmt(o.rotation||0)} ${fmt(c.x)} ${fmt(c.y)})"><rect class="sel-box" x="${fmt(b.x)}" y="${fmt(b.y)}" width="${fmt(b.w)}" height="${fmt(b.h)}" style="opacity:.55"/></g>`;
      });
      s=`<rect x="${fmt(minx)}" y="${fmt(miny)}" width="${fmt(maxx-minx)}" height="${fmt(maxy-miny)}" fill="none" stroke="#d8a14a" stroke-width="1.6px" vector-effect="non-scaling-stroke"/>`+s+guideLinesMarkup();
      gOverlay.innerHTML=s; return;
    }
    const o=sel[0];
    const b=objBBox(o), c={x:b.x+b.w/2,y:b.y+b.h/2};
    const hs=[ ['nw',b.x,b.y],['n',b.x+b.w/2,b.y],['ne',b.x+b.w,b.y],
               ['e',b.x+b.w,b.y+b.h/2],['se',b.x+b.w,b.y+b.h],['s',b.x+b.w/2,b.y+b.h],

    s+=`<circle class="sel-rot" cx="${fmt(c.x)}" cy="${fmt(rotY)}" r="${fmt(hr*1.25)}" style="pointer-events:none"/>`;
    s+=`<circle cx="${fmt(c.x)}" cy="${fmt(rotY)}" r="${fmt(hit)}" fill="transparent" data-handle="rot"/>`;
    if(o.type!=='path'){ // wynik operacji boolowskiej: tylko obrót i przesuwanie (bez skalowania uchwytami)

  function renderAll(){ renderObjects(); renderOverlay(); renderLayers(); document.getElementById('hintEmpty').style.display=state.objects.length?'none':''; }

  /* ---------------- Selection helpers ---------------- */
  function getSelected(){ return state.objects.filter(o=>state.selectedIds.includes(o.id)); }

  function select(id){ state.selectedIds = id? [id] : []; renderOverlay(); renderLayers(); renderProps(); }
  function toggleSelection(id){ const i=state.selectedIds.indexOf(id); if(i>=0) state.selectedIds.splice(i,1); else state.selectedIds.push(id); renderOverlay(); renderLayers(); renderProps(); }
  function rotatedBBox(o){

  /* ---------------- Coordinate mapping ---------------- */

  /* ---------------- Object factory ---------------- */

  /* ---- Offset / obwódka: tworzy nowy kształt powiększony (lub pomniejszony) o d mm ---- */
  function offsetShape(o, d){
    const c=JSON.parse(JSON.stringify(o)); c.id=uid(); c.name=''; c.repeat={type:'none'}; c.mode='cut';
    if(o.type==='rect'){
      c.x=o.x-d; c.y=o.y-d; c.w=Math.max(1,o.w+2*d); c.h=Math.max(1,o.h+2*d); c.rx=Math.max(0,(o.rx||0)+d);
    } else if(o.type==='ellipse'){
      c.x=o.x-d; c.y=o.y-d; c.w=Math.max(1,o.w+2*d); c.h=Math.max(1,o.h+2*d);
    } else if(o.type==='polygon'){
      const k=d/Math.cos(Math.PI/Math.max(3,o.sides||6)); c.x=o.x-k; c.y=o.y-k; c.w=Math.max(1,o.w+2*k); c.h=Math.max(1,o.h+2*k);

    } else if(o.type==='text'){
      const b=objBBox(o); c.type='rect'; delete c.text; delete c.font; delete c.fontSize;
      c.x=b.x-d; c.y=b.y-d; c.w=Math.max(1,b.w+2*d); c.h=Math.max(1,b.h+2*d); c.rx=Math.min(c.w,c.h)*0.22;

  }
  function addOffsetFromSel(d){
    const o=getSel(); if(!o) return;
    const c=offsetShape(o,d); if(!c) return;

    const i=state.objects.findIndex(x=>x.id===o.id);

    state.selectedIds=[c.id]; pushHistory(); renderAll(); renderProps();
  }

  /* ---------------- Operacje boolowskie (suma / różnica / część wspólna) ---------------- */
  const BOOL_TYPES=['rect','ellipse','polygon','star','path'];
  function flattenToPoly(o){
    let d;
    if(o.type==='path') d=o.d; else if(BOOL_TYPES.includes(o.type)) d=shapeD(o); else return null;
    const path=document.createElementNS(SVG_NS,'path'); path.setAttribute('d',d);
    let len; try{ len=path.getTotalLength(); }catch(e){ return null; }
    if(!len) return null;
    const n=Math.max(40, Math.min(720, Math.ceil(len/0.5))), pts=[];
    // deterministyczny mikro-jitter (~0.004 mm, niewidoczny dla lasera) rozbija
    // przypadki zdegenerowane (wspólne wierzchołki/krawędzie), na które algorytm
    // Greinera–Hormanna jest wrażliwy — dzięki temu przecięcia są zawsze czyste
    const EPS=0.004;
    for(let i=0;i<n;i++){ const p=path.getPointAtLength(len*i/n);
      pts.push([p.x+Math.sin((i+1)*12.9898)*EPS, p.y+Math.cos((i+1)*78.233)*EPS]); }
    if(o.type==='path'){
      const lcx=(o.bx||0)+(o.bw||0)/2, lcy=(o.by||0)+(o.bh||0)/2, r=deg2rad(o.rotation||0);
      for(const pt of pts){ const rp=rotatePt(pt[0],pt[1],lcx,lcy,r); pt[0]=rp.x+(o.x||0); pt[1]=rp.y+(o.y||0); }
    } else if(o.rotation){
      const c={x:o.x+o.w/2,y:o.y+o.h/2}, r=deg2rad(o.rotation);
      for(const pt of pts){ const rp=rotatePt(pt[0],pt[1],c.x,c.y,r); pt[0]=rp.x; pt[1]=rp.y; }

  function polyToPathD(poly){ return poly.map((p,i)=>(i?'L':'M')+fmt(p[0])+' '+fmt(p[1])).join('')+'Z'; }
  function polysBBoxMulti(polys){ let a={minx:Infinity,miny:Infinity,maxx:-Infinity,maxy:-Infinity};
    polys.forEach(pl=>pl.forEach(p=>{ a.minx=Math.min(a.minx,p[0]); a.miny=Math.min(a.miny,p[1]); a.maxx=Math.max(a.maxx,p[0]); a.maxy=Math.max(a.maxy,p[1]); })); return a; }
  function pointInPoly(pt, poly){ let inside=false; const x=pt[0],y=pt[1];
    for(let i=0,j=poly.length-1;i<poly.length;j=i++){ const xi=poly[i][0],yi=poly[i][1],xj=poly[j][0],yj=poly[j][1];
      if(((yi>y)!==(yj>y)) && (x<(xj-xi)*(y-yi)/(yj-yi)+xi)) inside=!inside; } return inside; }
  function polyArea(poly){ let a=0; for(let i=0,j=poly.length-1;i<poly.length;j=i++){ a+=(poly[j][0]+poly[i][0])*(poly[j][1]-poly[i][1]); } return a/2; }
  // Greiner–Hormann clipping (zwalidowane na znanych polach: kwadraty, okręgi, gwiazda)
  function clipGH(subject, clip, kind){
    function build(arr){ const vs=arr.map(p=>({x:p[0],y:p[1],alpha:0,inter:false,neighbour:null,entry:false,visited:false,next:null,prev:null}));
      const n=vs.length; for(let i=0;i<n;i++){ vs[i].next=vs[(i+1)%n]; vs[i].prev=vs[(i-1+n)%n]; } return vs; }
    let S=build(subject), C=build(clip);
    function segInt(p0,p1,p2,p3){ const d1x=p1.x-p0.x,d1y=p1.y-p0.y,d2x=p3.x-p2.x,d2y=p3.y-p2.y; const den=d1x*d2y-d1y*d2x;
      if(Math.abs(den)<1e-12) return null; const tx=p2.x-p0.x,ty=p2.y-p0.y; const a=(tx*d2y-ty*d2x)/den, b=(tx*d1y-ty*d1x)/den;
      if(a>1e-9&&a<1-1e-9&&b>1e-9&&b<1-1e-9) return {a,b,x:p0.x+a*d1x,y:p0.y+a*d1y}; return null; }
    function listOf(first){ const arr=[]; let v=first; do{ arr.push(v); v=v.next; }while(v!==first); return arr; }
    function nextNonInter(v){ let n=v.next; while(n.inter) n=n.next; return n; }
    function insertAlong(a,b,v){ let cur=a.next; while(cur!==b && cur.inter && cur.alpha<v.alpha) cur=cur.next; v.prev=cur.prev; v.next=cur; cur.prev.next=v; cur.prev=v; }
    let Slist=listOf(S[0]), Clist=listOf(C[0]);

      for(const cv of Clist){ if(cv.inter) continue; const cn=nextNonInter(cv); const I=segInt(sv,sn,cv,cn);
        if(I){ const i1={x:I.x,y:I.y,alpha:I.a,inter:true,neighbour:null,entry:false,visited:false,next:null,prev:null};
               const i2={x:I.x,y:I.y,alpha:I.b,inter:true,neighbour:null,entry:false,visited:false,next:null,prev:null};
               i1.neighbour=i2; i2.neighbour=i1; insertAlong(sv,sn,i1); insertAlong(cv,cn,i2); } } }
    Slist=listOf(S[0]); Clist=listOf(C[0]);
    if(Slist.filter(v=>v.inter).length===0){
      const sInC=pointInPoly([S[0].x,S[0].y],clip), cInS=pointInPoly([C[0].x,C[0].y],subject);
      if(kind==='intersection'){ if(sInC) return [subject.slice()]; if(cInS) return [clip.slice()]; return []; }
      if(kind==='difference'){ if(sInC) return []; if(cInS) return [subject.slice(), clip.slice().reverse()]; return [subject.slice()]; }
      if(sInC) return [clip.slice()]; if(cInS) return [subject.slice()]; return [subject.slice(),clip.slice()]; }
    const sIn=pointInPoly([S[0].x,S[0].y],clip), cIn=pointInPoly([C[0].x,C[0].y],subject);
    let status = kind==='intersection'?!sIn : kind==='union'?sIn : /*difference*/ sIn;
    for(const v of Slist){ if(v.inter){ v.entry=status; status=!status; } }
    status = kind==='intersection'?!cIn : kind==='union'?cIn : /*difference*/ !cIn;
    for(const v of Clist){ if(v.inter){ v.entry=status; status=!status; } }
    const result=[];
    while(true){ let start=null; for(const v of Slist){ if(v.inter&&!v.visited){ start=v; break; } } if(!start) break;
      const ring=[]; let cur=start;
      do{ cur.visited=true; if(cur.neighbour) cur.neighbour.visited=true;
        if(cur.entry){ do{ cur=cur.next; ring.push([cur.x,cur.y]); }while(!cur.inter); }
        else { do{ cur=cur.prev; ring.push([cur.x,cur.y]); }while(!cur.inter); }
        cur=cur.neighbour; } while(cur && cur!==start);
      if(ring.length>=3) result.push(ring); }
    return result;
  }
  function clipMany(polys, kind){
    let acc=polys[0];

      if(!res.length) return kind==='intersection'?[]:[acc];
      acc=res.reduce((a,b)=>Math.abs(polyArea(b))>Math.abs(polyArea(a))?b:a, res[0]); }
    return [acc];
  }
  function finalizeBoolean(sel, dStr, bb, mode){
    const result={id:uid(),type:'path',name:'Wynik operacji',d:dStr,fillRule:'evenodd',
      bx:bb.minx,by:bb.miny,bw:Math.max(1,bb.maxx-bb.minx),bh:Math.max(1,bb.maxy-bb.miny),
      x:0,y:0,rotation:0,mode:mode||'cut',visible:true,locked:false,repeat:{type:'none'}};
    const insertAt=Math.min(...sel.map(o=>state.objects.indexOf(o)));
    state.objects=state.objects.filter(o=>!sel.includes(o));
    state.objects.splice(insertAt,0,result);
    state.selectedIds=[result.id]; pushHistory(); renderAll(); renderProps();
  }
  function booleanOp(kind){
    const sel=getSelected().filter(o=>BOOL_TYPES.includes(o.type));
    if(sel.length<2){ alert('Zaznacz co najmniej 2 kształty (prostokąt, elipsa, wielokąt, gwiazda lub wynik operacji).'); return; }
    // kolejność dla różnicy: od spodu (pierwszy = baza, kolejne odejmowane)
    const polys=sel.map(flattenToPoly).filter(Boolean);
    if(polys.length<2) return;
    const rings = polys.length===2 ? clipGH(polys[0],polys[1],kind) : clipMany(polys,kind);
    if(!rings.length){ alert(kind==='intersection'?'Zaznaczone kształty nie mają części wspólnej.':kind==='difference'?'Po odjęciu nie zostało nic.':'Operacja nie dała wyniku.'); return; }
    finalizeBoolean(sel, rings.map(polyToPathD).join(' '), polysBBoxMulti(rings), sel[0].mode);
  }

  /* ---------------- Pióro / krzywe ---------------- */
  function penAddPoint(docP){
    const p=[snap(docP.x), snap(docP.y)];
    if(!state.penDraft){ state.penDraft=[p]; }
    else {
      const first=state.penDraft[0];
      if(state.penDraft.length>=3 && Math.hypot(p[0]-first[0],p[1]-first[1]) < state.view.w*0.022){ penFinish(); return; }
      state.penDraft.push(p);

  }
  function penFinish(){
    const pts=state.penDraft; state.penDraft=null; state.penPreview=null;
    if(pts && pts.length>=3){
      const d=pts.map((p,i)=>(i?'L':'M')+fmt(p[0])+' '+fmt(p[1])).join('')+'Z';
      const bb=polysBBoxMulti([pts]);
      const o={id:uid(),type:'path',name:'Rysunek',d,fillRule:'nonzero',
        bx:bb.minx,by:bb.miny,bw:Math.max(1,bb.maxx-bb.minx),bh:Math.max(1,bb.maxy-bb.miny),
        x:0,y:0,rotation:0,mode:'cut',visible:true,locked:false,repeat:{type:'none'}};
      state.objects.push(o); state.selectedIds=[o.id]; pushHistory();
    }
    state.tool='select'; syncToolButtons(); renderAll(); renderProps();
  }
  function penCancel(){ state.penDraft=null; state.penPreview=null; renderOverlay(); }
  function renderPenDraft(){

    if(o.type==='line') h+=`<div class="field"><label>Kierunek</label><div class="seg" data-seg="flip"><button class="${!o.flip?'on':''}" data-flip="0">↘ ukośna</button><button class="${o.flip?'on':''}" data-flip="1">↗ ukośna</button></div></div>`;
    if(o.type==='text'){
      h+=`<div class="field"><label>Treść napisu</label><input type="text" data-prop="text" value="${escapeXml(o.text||'')}" maxlength="80"></div>`;
      h+=`<div class="field"><label>Czcionka</label><select data-prop="font">${FONTS.map(([v,l])=>`<option value='${v}' ${v===o.font?'selected':''}>${l}</option>`).join('')}</select></div>`;
      h+=rangeField('Wielkość (mm)','fontSize',o.fontSize||24,4,160,1,o);
    }
    // repeat modifier
    const r=o.repeat||{type:'none'};
    h+=`<div class="field"><label>Powielanie (modyfikator)</label><select data-prop="repeat.type">
      ${[['none','Brak'],['linear','Liniowe'],['grid','Siatka'],['circular','Wokół środka'],['mirror','Lustro']].map(([v,l])=>`<option value="${v}" ${r.type===v?'selected':''}>${l}</option>`).join('')}
      </select></div>`;
    if(r.type==='linear'){
      h+=rangeField('Liczba kopii','repeat.count',r.count||3,1,40,1);
      h+=`<div class="field"><label>Odstęp X / Y (mm)</label><div class="row2"><input type="number" data-prop="repeat.dx" value="${fmt(r.dx??30)}" step="1"><input type="number" data-prop="repeat.dy" value="${fmt(r.dy??0)}" step="1"></div></div>`;
    } else if(r.type==='grid'){
      h+=`<div class="field"><label>Kolumny / Wiersze</label><div class="row2"><input type="number" data-prop="repeat.cols" value="${r.cols||3}" min="1" step="1"><input type="number" data-prop="repeat.rows" value="${r.rows||3}" min="1" step="1"></div></div>`;
      h+=`<div class="field"><label>Odstęp X / Y (mm)</label><div class="row2"><input type="number" data-prop="repeat.dx" value="${fmt(r.dx??30)}" step="1"><input type="number" data-prop="repeat.dy" value="${fmt(r.dy??30)}" step="1"></div></div>`;
    } else if(r.type==='circular'){
      h+=rangeField('Liczba kopii','repeat.count',r.count||6,2,40,1);
      h+=rangeField('Kąt całkowity (°)','repeat.angle',r.angle??360,30,360,5);
      h+=rangeField('Promień (mm)','repeat.radius',r.radius??40,0,200,1);
    } else if(r.type==='mirror'){
      h+=`<div class="field"><label>Oś lustra</label><select data-prop="repeat.axis">
        ${[['vertical','Pionowa'],['horizontal','Pozioma'],['both','Obie']].map(([v,l])=>`<option value="${v}" ${ (r.axis||'vertical')===v?'selected':''}>${l}</option>`).join('')}</select></div>`;
    }
    // offset / obwódka (nie dla linii)
    if(o.type!=='line' && o.type!=='path'){
      h+=`<div class="field"><label>Obwódka / offset (mm)</label><div class="row2">
        <input type="number" id="offsetVal" value="5" step="1" style="flex:0 0 90px">
        <button type="button" id="offsetBtn" class="tbtn" style="flex:1;justify-content:center">+ Utwórz obwódkę</button></div></div>`;
    }
    if(o.type==='path' && (o.d.match(/M/g)||[]).length===1){
      h+=`<div class="field"><button type="button" id="smoothBtn" class="tbtn" style="width:100%;justify-content:center">〰 Wygładź w krzywe</button></div>`;
    }
    propsEl.innerHTML=h;
    bindProps();
  }
  function rangeField(label,prop,val,min,max,step,o){
    const bound=o&&isBound(o,prop);
    const v=bound? boundVal(o,prop) : val;
    return `<div class="field"><label>${label}</label><div class="range-wrap">
      <input type="range" data-prop="${prop}" min="${min}" max="${max}" step="${step}" value="${v}"${bound?' disabled':''}>
      <span class="range-val" data-out="${prop}">${fmt(v)}</span></div>
      ${o?bindSelectHtml(o,prop):''}</div>`;
  }
  function numField(label,prop,o,opts){
    opts=opts||{};
    const bound=isBound(o,prop);
    const v=bound? boundVal(o,prop) : o[prop];
    const minAttr=opts.min!=null?` min="${opts.min}"`:'';
    return `<div class="field"><label>${label}</label>
      <input type="number" data-prop="${prop}" value="${fmt(v)}" step="${opts.step||1}"${minAttr}${bound?' disabled':''}>
      ${bindSelectHtml(o,prop)}</div>`;
  }
  /* ---- Powiązanie wartości elementu z parametrem globalnym (jak Parameters w Cuttle) ---- */
  function isBound(o,prop){ return !!(o.bindings && o.bindings[prop] && state.params.some(p=>p.id===o.bindings[prop])); }
  function boundVal(o,prop){ const p=state.params.find(x=>x.id===o.bindings[prop]); return p?p.value:o[prop]; }
  function bindSelectHtml(o,prop){
    if(!state.params.length) return '';
    const bound=(o.bindings&&o.bindings[prop])||'';
    return `<select class="bind-sel" data-bind="${prop}" title="Połącz tę wartość z parametrem globalnym — zmiana suwaka parametru będzie ją automatycznie zmieniać">
      <option value="">🔗 brak powiązania — wartość stała</option>
      ${state.params.map(p=>`<option value="${p.id}" ${bound===p.id?'selected':''}>🔗 powiąż z: ${escapeXml(p.name)}</option>`).join('')}
    </select>`;
  }
  function setProp(o,path,val){
    if(path.startsWith('repeat.')){ o.repeat=o.repeat||{type:'none'}; o.repeat[path.slice(7)]=val; }
    else o[path]=val;
  }
  function bindProps(){
    const o=getSel(); if(!o) return;
    propsEl.querySelectorAll('[data-prop]').forEach(inp=>{
      const path=inp.getAttribute('data-prop');
      const isNum=inp.type==='range'||inp.type==='number';
      const ev=inp.type==='range'?'input':'change';
      inp.addEventListener(ev, ()=>{
        let val=inp.value; if(isNum) val=Number(val);
        if(path==='repeat.type'){ o.repeat=normalizeRepeat(val,o.repeat); renderProps(); renderObjects(); renderOverlay(); if(inp.type!=='range') pushHistory(); return; }
        setProp(o,path,val);
        const out=propsEl.querySelector(`[data-out="${CSS.escape(path)}"]`); if(out) out.textContent=fmt(val);
        renderObjects(); renderOverlay();
        if(ev==='change') pushHistory();
      });
      if(inp.type==='range'){ inp.addEventListener('change',()=>pushHistory()); }
    });
    propsEl.querySelectorAll('[data-bind]').forEach(sel=>{
      const prop=sel.getAttribute('data-bind');
      sel.addEventListener('change',()=>{
        const val=sel.value;
        o.bindings=o.bindings||{};
        if(val){ o.bindings[prop]=val; setProp(o,prop,boundVal(o,prop)); }
        else delete o.bindings[prop];
        renderProps(); renderObjects(); renderOverlay(); pushHistory();
      });
    });
    propsEl.querySelectorAll('[data-seg="mode"] button').forEach(b=>b.addEventListener('click',()=>{ o.mode=b.getAttribute('data-mode'); renderProps(); renderObjects(); pushHistory(); }));
    propsEl.querySelectorAll('[data-seg="flip"] button').forEach(b=>b.addEventListener('click',()=>{ o.flip=b.getAttribute('data-flip')==='1'; renderProps(); renderObjects(); pushHistory(); }));
    const offBtn=propsEl.querySelector('#offsetBtn');
    if(offBtn) offBtn.addEventListener('click',()=>{ const d=Number(propsEl.querySelector('#offsetVal').value)||0; if(d!==0) addOffsetFromSel(d); });
    const smBtn=propsEl.querySelector('#smoothBtn');
    if(smBtn) smBtn.addEventListener('click',()=>{ const o=getSel(); if(o) smoothPathObj(o); });
  }
  function normalizeRepeat(type,old){
    if(type==='none') return {type:'none'};
    if(type==='linear') return {type,count:old.count||3,dx:old.dx??30,dy:old.dy??0};
    if(type==='grid') return {type,cols:old.cols||3,rows:old.rows||3,dx:old.dx??30,dy:old.dy??30};
    if(type==='circular') return {type,count:old.count||6,angle:old.angle??360,radius:old.radius??40};
    if(type==='mirror') return {type,axis:old.axis||'vertical'};
    return {type:'none'};
  }
  // live-update the numeric fields while dragging on canvas
  function syncPropsLive(){
    const o=getSel(); if(!o) return;
    [['x',o.x],['y',o.y],['w',o.w],['h',o.h],['rotation',o.rotation],['fontSize',o.fontSize]].forEach(([p,v])=>{
      if(v==null) return;
      const inp=propsEl.querySelector(`[data-prop="${p}"]`); if(inp && document.activeElement!==inp) inp.value=fmt(v);
      const out=propsEl.querySelector(`[data-out="${p}"]`); if(out) out.textContent=fmt(v);
    });
  }

  /* ---------------- Parametry globalne (jak Parameters w Cuttle) ----------------
     Liczby sterujące całym projektem — można je powiązać 🔗 z dowolną wartością
     elementu (pozycja, rozmiar, obrót, liczba boków...). Zmiana suwaka parametru
     natychmiast aktualizuje "na żywo" wszystkie powiązane elementy naraz. */
  const paramsEl=document.getElementById('params');
  function renderParams(){
    if(!state.params.length){
      paramsEl.innerHTML=`<div class="params-empty">Brak parametrów. Dodaj parametr (np. „grubość materiału” albo „rozmiar”), a potem w panelu właściwości elementu wybierz 🔗 powiązanie z nim — odtąd jeden suwak będzie sterował całym projektem naraz, tak jak Parameters w Cuttle.</div>`;
      return;
    }
    paramsEl.innerHTML=state.params.map(p=>`
      <div class="param-card" data-id="${p.id}">
        <div class="prow">
          <input type="text" data-pf="name" value="${escapeXml(p.name)}" maxlength="28" title="Nazwa parametru">
          <button type="button" class="pdel" data-pf="del" title="Usuń parametr">✕</button>
        </div>
        <div class="prow">
          <input type="range" data-pf="value" min="${fmt(p.min)}" max="${fmt(p.max)}" step="${fmt(p.step||0.1)}" value="${fmt(p.value)}">
          <input type="number" data-pf="value" value="${fmt(p.value)}" step="${fmt(p.step||0.1)}">
        </div>
        <div class="prow">
          <span class="ptag">zakres</span>
          <input type="number" data-pf="min" value="${fmt(p.min)}" step="${fmt(p.step||0.1)}" title="Minimum">
          <input type="number" data-pf="max" value="${fmt(p.max)}" step="${fmt(p.step||0.1)}" title="Maksimum">
        </div>
      </div>`).join('');
    paramsEl.querySelectorAll('.param-card').forEach(card=>{
      const id=card.getAttribute('data-id'), p=state.params.find(x=>x.id===id);
      if(!p) return;
      card.querySelectorAll('[data-pf]').forEach(inp=>{
        const f=inp.getAttribute('data-pf');
        if(f==='del'){ inp.addEventListener('click',()=>deleteParam(id)); return; }
        const live = (f==='value');
        inp.addEventListener(live?'input':'change', ()=>{
          if(f==='name'){ p.name=inp.value.trim()||p.name; renderProps(); return; }
          let v=Number(inp.value);
          if(f==='min'){ p.min=v; if(p.max<p.min) p.max=p.min; if(p.value<p.min) p.value=p.min; }
          else if(f==='max'){ p.max=v; if(p.min>p.max) p.min=p.max; if(p.value>p.max) p.value=p.max; }
          else if(f==='value'){ p.value=clamp(v,p.min,p.max); }
          if(f==='value'){
            card.querySelectorAll('[data-pf="value"]').forEach(other=>{ if(other!==inp) other.value=fmt(p.value); });
          } else {
            const rng=card.querySelector('input[type=range]'); rng.min=fmt(p.min); rng.max=fmt(p.max); rng.value=fmt(p.value);
            card.querySelectorAll('[data-pf="value"]').forEach(o2=>o2.value=fmt(p.value));
          }
          applyParamBindings();
        });
        inp.addEventListener('change',()=>pushHistory());
      });
    });
  }
  function addParam(){
    const n=state.params.length+1;
    state.params.push({id:puid(), name:'parametr_'+n, value:10, min:0, max:100, step:1});
    renderParams(); renderProps(); pushHistory();
  }
  function deleteParam(id){
    state.params=state.params.filter(p=>p.id!==id);
    state.objects.forEach(o=>{ if(o.bindings){ Object.keys(o.bindings).forEach(k=>{ if(o.bindings[k]===id) delete o.bindings[k]; }); } });
    renderParams(); renderProps(); renderObjects(); renderOverlay(); pushHistory();
  }
  // Zastosuj aktualne wartości parametrów do wszystkich powiązanych właściwości — "na żywo".
  function applyParamBindings(){
    let changed=false;
    state.objects.forEach(o=>{
      if(!o.bindings) return;
      for(const prop in o.bindings){
        const p=state.params.find(x=>x.id===o.bindings[prop]); if(!p) continue;
        setProp(o,prop,p.value); changed=true;
      }
    });
    if(changed){ renderObjects(); renderOverlay(); syncBoundPropsLive(); }
  }
  // odśwież wyświetlane wartości pól powiązanych z parametrem (bez przebudowy całego panelu)
  function syncBoundPropsLive(){
    const o=getSel(); if(!o||!o.bindings) return;
    for(const prop in o.bindings){
      const p=state.params.find(x=>x.id===o.bindings[prop]); if(!p) continue;
      const inp=propsEl.querySelector(`[data-prop="${CSS.escape(prop)}"]`); if(inp) inp.value=fmt(p.value);
      const out=propsEl.querySelector(`[data-out="${CSS.escape(prop)}"]`); if(out) out.textContent=fmt(p.value);
    }
  }
  document.getElementById('addParamBtn').addEventListener('click',addParam);

  /* ---------------- Layers panel ---------------- */
  const layersEl=document.getElementById('layers');
  function renderLayers(){
    if(!state.objects.length){ layersEl.innerHTML=`<div style="padding:4px 6px;font-size:.78rem;color:var(--muted)">Brak elementów.</div>`; return; }
    layersEl.innerHTML=state.objects.slice().reverse().map(o=>{
      const sw=o.mode==='engrave'?'sw-engrave':o.mode==='score'?'sw-score':'sw-cut';
      return `<div class="layer ${state.selectedIds.includes(o.id)?'sel':''}" data-id="${o.id}">
        <span class="swatch ${sw}"></span>
        <span class="lname">${escapeXml(autoName(o))}</span>
        <button class="lico" data-act="up" title="Wyżej">▲</button>
        <button class="lico" data-act="down" title="Niżej">▼</button>
        <button class="lico" data-act="vis" title="Pokaż/ukryj">${o.visible?'👁':'🚫'}</button>
        <button class="lico" data-act="lock" title="Zablokuj">${o.locked?'🔒':'🔓'}</button>
        <button class="lico" data-act="del" title="Usuń">✕</button>
      </div>`;
    }).join('');
    layersEl.querySelectorAll('.layer').forEach(row=>{
      const id=row.getAttribute('data-id');
      row.addEventListener('click',e=>{ if(e.target.closest('[data-act]')) return; select(id); });
      row.querySelectorAll('[data-act]').forEach(btn=>btn.addEventListener('click',e=>{
        e.stopPropagation(); layerAction(id,btn.getAttribute('data-act'));
      }));
    });
  }
  function layerAction(id,act){
    const i=state.objects.findIndex(o=>o.id===id); if(i<0) return; const o=state.objects[i];
    if(act==='up'){ if(i<state.objects.length-1){ state.objects.splice(i,1); state.objects.splice(i+1,0,o); pushHistory(); } }
    else if(act==='down'){ if(i>0){ state.objects.splice(i,1); state.objects.splice(i-1,0,o); pushHistory(); } }
    else if(act==='vis'){ o.visible=!o.visible; pushHistory(); }
    else if(act==='lock'){ o.locked=!o.locked; pushHistory(); }
    else if(act==='del'){ state.objects.splice(i,1); state.selectedIds=state.selectedIds.filter(x=>x!==id); pushHistory(); }
    renderAll(); renderProps();
  }

  /* ---------------- History ---------------- */
  function snapshot(){ return JSON.stringify({objects:state.objects,selectedIds:state.selectedIds}); }
  function pushHistory(){
    state.history=state.history.slice(0,state.hIndex+1);
    state.history.push(snapshot()); state.hIndex=state.history.length-1;
    if(state.history.length>120){ state.history.shift(); state.hIndex--; }
    updateUndoButtons();
  }
  function restore(s){ const d=JSON.parse(s); state.objects=d.objects; state.selectedIds=d.selectedIds||(d.selectedId?[d.selectedId]:[]); renderAll(); renderProps(); }
  function undo(){ if(state.hIndex>0){ state.hIndex--; restore(state.history[state.hIndex]); updateUndoButtons(); } }
  function redo(){ if(state.hIndex<state.history.length-1){ state.hIndex++; restore(state.history[state.hIndex]); updateUndoButtons(); } }
  function updateUndoButtons(){ document.getElementById('undoBtn').disabled=state.hIndex<=0; document.getElementById('redoBtn').disabled=state.hIndex>=state.history.length-1; }

  /* ---------------- Toolbar wiring ---------------- */
  const toolsEl=document.getElementById('tools');
  TOOLS.forEach(t=>{
    const b=document.createElement('button'); b.className='tbtn'+(t.key==='select'?' active':''); b.dataset.tool=t.key;
    b.innerHTML=`<span class="ico">${t.ico}</span> ${t.label}`; b.title=t.label;
    b.addEventListener('click',()=>{ if(state.penDraft && t.key!=='pen') penCancel(); state.tool=t.key; syncToolButtons(); });
    toolsEl.appendChild(b);
  });
  function syncToolButtons(){ toolsEl.querySelectorAll('.tbtn').forEach(b=>b.classList.toggle('active',b.dataset.tool===state.tool)); updateCanvasCursor(); }
  function updateCanvasCursor(){ canvas.style.cursor = state.tool==='pan'?'grab' : (state.tool==='select'?'default':'crosshair'); }

  document.getElementById('undoBtn').addEventListener('click',undo);
  document.getElementById('redoBtn').addEventListener('click',redo);
  document.getElementById('copyBtn').addEventListener('click',copySel);
  document.getElementById('pasteBtn').addEventListener('click',pasteClipboard);
  document.getElementById('dupBtn').addEventListener('click',duplicateSel);
  document.getElementById('delBtn').addEventListener('click',deleteSel);
  document.getElementById('zoomIn').addEventListener('click',()=>zoomBy(0.83));
  document.getElementById('zoomOut').addEventListener('click',()=>zoomBy(1.2));
  document.getElementById('zoomFit').addEventListener('click',zoomFit);
  const snapBtn=document.getElementById('snapBtn');
  snapBtn.classList.toggle('active',state.snap);
  snapBtn.addEventListener('click',()=>{ state.snap=!state.snap; snapBtn.classList.toggle('active',state.snap); });
  document.getElementById('exportBtn').addEventListener('click',exportSVG);

  function duplicateSel(){ const sel=getSelected(); if(!sel.length) return;
    const copies=sel.map(o=>{ const c=JSON.parse(JSON.stringify(o)); c.id=uid(); c.x+=10; c.y+=10; c.name=''; return c; });
    state.objects.push(...copies); state.selectedIds=copies.map(c=>c.id); pushHistory(); renderAll(); renderProps(); }
  function deleteSel(){ const ids=state.selectedIds.slice(); if(!ids.length) return;
    state.objects=state.objects.filter(o=>!ids.includes(o.id)); state.selectedIds=[]; pushHistory(); renderAll(); renderProps(); }

  /* ---------------- Schowek: kopiuj / wklej (Ctrl+C / Ctrl+V) ---------------- */
  let clipboard=[];
  function copySel(){ const sel=getSelected(); if(!sel.length) return;
    clipboard=sel.map(o=>JSON.parse(JSON.stringify(o))); }
  function pasteClipboard(){ if(!clipboard.length) return;
    const copies=clipboard.map(o=>{ const c=JSON.parse(JSON.stringify(o)); c.id=uid(); c.x+=10; c.y+=10; c.name=''; return c; });
    clipboard=copies.map(c=>JSON.parse(JSON.stringify(c))); // kolejne Ctrl+V odsuwa dalej, jak w Illustratorze/Cuttle
    state.objects.push(...copies); state.selectedIds=copies.map(c=>c.id); pushHistory(); renderAll(); renderProps(); }
  function zoomBy(f){ const r=canvasRect(); const aspect=(r.width&&r.height)?r.width/r.height:state.view.w/state.view.h;
    const v=state.view; const cx=v.x+v.w/2, cy=v.y+v.h/2;
    v.w=clamp(v.w*f,20,4000); v.h=v.w/aspect; v.x=cx-v.w/2; v.y=cy-v.h/2; applyView(); renderOverlay(); }
  function zoomFit(){
    const r=canvasRect(); const aspect=(r.width&&r.height)? r.width/r.height : (state.docW+40)/(state.docH+40);
    const m=20, dw=state.docW+2*m, dh=state.docH+2*m;
    let vw=Math.max(dw, dh*aspect), vh=vw/aspect;
    state.view={ x:-m-(vw-dw)/2, y:-m-(vh-dh)/2, w:vw, h:vh };
    applyView(); renderOverlay();
  }

  canvas.addEventListener('dblclick', ()=>{ if(state.tool==='pen' && state.penDraft) penFinish(); });
  /* keyboard */
  window.addEventListener('keyup',e=>{ if(e.code==='Space'){ spaceDown=false; if(!drag) updateCanvasCursor(); } });
  window.addEventListener('keydown',e=>{
    const typing=/^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName);
    if(state.penDraft && !typing){ if(e.key==='Enter'){ e.preventDefault(); penFinish(); return; } if(e.key==='Escape'){ e.preventDefault(); penCancel(); return; } }
    if(e.code==='Space' && !typing){ spaceDown=true; if(!drag) canvas.style.cursor='grab'; e.preventDefault(); return; }
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){ e.preventDefault(); e.shiftKey?redo():undo(); return; }
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'){ e.preventDefault(); redo(); return; }
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='d'){ e.preventDefault(); duplicateSel(); return; }
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='c'){ if(!typing){ e.preventDefault(); copySel(); } return; }
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='v'){ if(!typing){ e.preventDefault(); pasteClipboard(); } return; }
    if(typing) return;
    if(e.key==='Delete'||e.key==='Backspace'){ e.preventDefault(); deleteSel(); return; }
    const selArr=getSelected();
    if(selArr.length && ['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)){
      e.preventDefault(); const step=e.shiftKey?state.grid:1;
      let dx=0,dy=0; if(e.key==='ArrowUp')dy=-step; if(e.key==='ArrowDown')dy=step; if(e.key==='ArrowLeft')dx=-step; if(e.key==='ArrowRight')dx=step;
      selArr.forEach(o=>{ o.x+=dx; o.y+=dy; });
      renderObjects(); renderOverlay(); syncPropsLive(); pushHistory(); return;
    }
    const map={v:'select',h:'pan',r:'rect',o:'ellipse',p:'polygon',s:'star',l:'line',n:'pen',t:'text'};
    if(map[e.key.toLowerCase()]){ if(state.penDraft) penCancel(); state.tool=map[e.key.toLowerCase()]; syncToolButtons(); }
  });

  /* ---------------- Export ---------------- */
  function exportSVG(){
    const W=state.docW,H=state.docH;
    const body=state.objects.filter(o=>o.visible).map(o=>objMarkup(o,true)).join('');
    const svg=`<?xml version="1.0" encoding="UTF-8"?>\n<svg xmlns="${SVG_NS}" viewBox="0 0 ${W} ${H}" width="${W}mm" height="${H}mm">\n${body}\n</svg>`;
    const blob=new Blob([svg],{type:'image/svg+xml'}); const url=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url; a.download=`projekt-laser-${Date.now()}.svg`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
  }

  /* ---------------- Templates ---------------- */
  const TEMPLATES=[
    {key:'tag',label:'Zawieszka z napisem',build(){
      return [
        {...defaultsFor('rect'),x:90,y:75,w:120,h:55,rx:10,mode:'cut',name:'Baza zawieszki'},
        {...defaultsFor('ellipse'),x:96,y:88,w:14,h:14,mode:'cut',name:'Otwór'},
        {...defaultsFor('text'),x:155,y:103,text:'Anna',fontSize:26,mode:'engrave',name:'Napis'}
      ];
    }},
    {key:'mandala',label:'Mandala (rozeta)',build(){
      const pet={...defaultsFor('ellipse'),x:142,y:40,w:16,h:48,mode:'cut',name:'Płatek',repeat:{type:'circular',count:12,angle:360,radius:60}};
      return [pet,{...defaultsFor('ellipse'),x:142,y:92,w:16,h:16,mode:'cut',name:'Środek'}];
    }},
    {key:'star',label:'Gwiazda ozdobna',build(){
      return [{...defaultsFor('star'),x:110,y:30,w:80,h:80,points:6,inner:0.45,mode:'cut',name:'Gwiazda'}];
    }},
    {key:'grid',label:'Siatka kółek',build(){
      return [{...defaultsFor('ellipse'),x:60,y:50,w:20,h:20,mode:'cut',name:'Kółko',repeat:{type:'grid',cols:6,rows:4,dx:32,dy:32}}];
    }},
    {key:'frame',label:'Ramka + napis',build(){
      return [
        {...defaultsFor('rect'),x:50,y:40,w:200,h:120,rx:14,mode:'cut',name:'Ramka zewn.'},
        {...defaultsFor('rect'),x:62,y:52,w:176,h:96,rx:9,mode:'score',name:'Linia ozdobna'},
        {...defaultsFor('text'),x:150,y:104,text:'Rodzina',fontSize:30,mode:'engrave',name:'Napis'}
      ];
    }},
    {key:'mirror',label:'Ornament lustrzany',build(){
      return [{...defaultsFor('star'),x:120,y:60,w:60,h:80,points:5,inner:0.4,rotation:0,mode:'cut',name:'Ornament',repeat:{type:'mirror',axis:'both'}}];
    }}
  ];
  const tplEl=document.getElementById('templates');
  TEMPLATES.forEach(t=>{ const b=document.createElement('button'); b.textContent=t.label; b.addEventListener('click',()=>{
    const objs=t.build(); objs.forEach(o=>{o.id=uid();}); state.objects.push(...objs); state.selectedIds=[objs[objs.length-1].id];
    pushHistory(); renderAll(); renderProps(); zoomFit();
  }); tplEl.appendChild(b); });

  /* ---------------- Init ---------------- */
  buildCanvasSkeleton(); syncViewAspect(); zoomFit(); renderGrid(); renderAll(); renderProps(); renderParams();
  updateCanvasCursor();
  pushHistory();
  window.addEventListener('resize',()=>{ syncViewAspect(); applyView(); renderOverlay(); });
})();
</script>
</body>
</html>
